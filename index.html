<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

<title>Full Body A/B Tracker</title>
<link rel="manifest" href="manifest.webmanifest" />
<style>
:root{--bg:#0b1020;--card:#121a2f;--muted:#91a0bd;--text:#f7f9fc;--accent:#7dd3fc;--accent2:#86efac;--danger:#fca5a5;--border:#24304f;--gold:#fde68a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0b1020,#0f172a);color:var(--text)}
.wrap{max-width:980px;margin:auto;padding:18px 14px 90px}.top{position:sticky;top:0;z-index:5;background:rgba(11,16,32,.92);backdrop-filter:blur(12px);padding:12px 0 10px;border-bottom:1px solid rgba(255,255,255,.05)}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0 0}.tab{border:1px solid var(--border);background:#0e162a;color:var(--text);padding:9px 12px;border-radius:999px;white-space:nowrap}.tab.active{background:var(--accent);color:#06111a;border-color:transparent;font-weight:700}
.panel{display:none;padding-top:16px}.panel.active{display:block}.card{background:rgba(18,26,47,.95);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.title{font-weight:800;font-size:16px}.meta{color:var(--muted);font-size:13px;line-height:1.45}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#1b2948;color:#cbd5e1;font-size:12px;margin-right:5px}.badge{background:#17362b;color:#b7f7d0}.gold{background:#3a3318;color:var(--gold)}
button,.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#071018}.secondary{background:#1f2a44;color:var(--text);border:1px solid var(--border)}.danger{background:#3a1f26;color:#ffd0d5;border:1px solid #6b2a35}.success{background:var(--accent2);color:#062312}
input,select,textarea{width:100%;background:#0d1528;border:1px solid var(--border);color:var(--text);border-radius:12px;padding:10px;font:inherit}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 6px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{color:#cbd5e1}.small{font-size:12px}.muted{color:var(--muted)}
.exercise{padding:12px 0;border-bottom:1px solid var(--border)}.exercise:last-child{border-bottom:0}.setrow{display:grid;grid-template-columns:48px 1fr 1fr 58px;gap:7px;align-items:center;margin-top:8px}.setrow input{padding:8px}.check{width:22px;height:22px}.note{font-size:12px;color:var(--muted);margin-top:5px}.sectionhead{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:#a7b5cf}.empty{padding:24px;text-align:center;color:var(--muted)}
.miniChart{width:100%;height:180px;background:#0d1528;border:1px solid var(--border);border-radius:14px;margin-top:10px}.goal{padding:10px;border:1px solid var(--border);border-radius:14px;background:#0d1528}.goal strong{display:block;margin-bottom:4px}.level{font-size:28px;font-weight:900}.tiny{font-size:11px}.highlight{border-color:#36577a}.warning{border-color:#705d21}.divider{height:1px;background:var(--border);margin:12px 0}
@media(max-width:620px){.grid3,.grid2{grid-template-columns:1fr}.setrow{grid-template-columns:40px 1fr 1fr 44px}.wrap{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><h1>Full Body A/B Tracker</h1><div class="sub">Rientro graduale · forza · scapole · spalle · piegamenti e trazioni</div>
 <div class="tabs"><button class="tab active" data-tab="today">Allenamento</button><button class="tab" data-tab="history">Storico</button><button class="tab" data-tab="progress">Progressi</button><button class="tab" data-tab="body">Peso</button><button class="tab" data-tab="tests">Test</button><button class="tab" data-tab="programs">Programmi</button><button class="tab" data-tab="backup">Backup</button></div></div>
 <section id="today" class="panel active"></section><section id="history" class="panel"></section><section id="progress" class="panel"></section><section id="body" class="panel"></section><section id="tests" class="panel"></section><section id="programs" class="panel"></section><section id="backup" class="panel"></section>
</div>
<script>
const STORE='fullBodyTracker_v3', OLD2='fullBodyTracker_v2', OLD='fullBodyTracker_v1';
const program={
 id:'fb-ab-restart-v3',name:'Full Body Restart A/B',version:3,active:true,
 description:'3 sedute/settimana alternate A/B. Circa 40 min di lavoro, 55–65 min con recuperi.',
 weeks:[{from:1,to:2,label:'Rientro',modifier:'RIR 3. Usa 2 serie sui fondamentali principali se senti molta fatica.'},{from:3,to:4,label:'Costruzione',modifier:'3 serie sui fondamentali, RIR 2–3.'},{from:5,to:6,label:'Consolidamento',modifier:'Prova a raggiungere il limite alto del range con RIR ~2.'}],
 sessions:{
  A:{name:'A · Spinta + quadricipiti + spalle',exercises:[
   {id:'scap-pushup',section:'Scapole · 6 min',name:'Scapular push-up inclinati',sets:2,reps:'8–12',rest:30,loadType:'variant',note:'Gomiti estesi. Se a terra è troppo difficile, usa panca o Smith.'},
   {id:'facepull',section:'Scapole · 6 min',name:'Face pull',sets:2,reps:'12–15',rest:30,loadType:'kg',increment:2.5,note:'Tira verso occhi/zigomi, gomiti aperti, scapole controllate.'},
   {id:'legpress',section:'Forza · 25–28 min',name:'Leg press',sets:3,reps:'8–12',rest:90,loadType:'kg',increment:5,note:'Controllo completo. Niente rimbalzi.'},
   {id:'dbincline',section:'Forza · 25–28 min',name:'Spinte manubri su panca inclinata 15–30°',sets:3,reps:'8–12',rest:90,loadType:'kg',increment:1,note:'Segna il peso di un singolo manubrio. Fermati a RIR 2–3.'},
   {id:'latneutral',section:'Forza · 25–28 min',name:'Lat machine presa neutra',sets:3,reps:'8–12',rest:90,loadType:'kg',increment:2.5,note:'Depressione scapolare prima di tirare. È il ponte verso le trazioni.'},
   {id:'lateralraise',section:'Spalle · 5 min',name:'Alzate laterali',sets:2,reps:'12–15',rest:45,loadType:'kg',increment:1,note:'Movimento controllato; niente slancio. Superset ideale con lat machine.'},
   {id:'pushup-progress',section:'Skill · 4–5 min',name:'Piegamenti · livello attuale',sets:2,reps:'6–10',rest:60,loadType:'variant',note:'Usa la variante suggerita nella sezione Progressi.'},
   {id:'deadbug',section:'Core · 2 min',name:'Dead bug',sets:2,reps:'6–8/lato',rest:30,loadType:'bodyweight',note:'Lombare aderente al supporto.'}
  ]},
  B:{name:'B · Catena posteriore + tirata + spalle',exercises:[
   {id:'straightarm',section:'Scapole · 6 min',name:'Straight-arm pulldown',sets:2,reps:'10–12',rest:30,loadType:'kg',increment:2.5,note:'Pensa a portare le scapole verso le tasche.'},
   {id:'scap-pull',section:'Scapole · 6 min',name:'Scapular pull / depressioni alla lat machine',sets:2,reps:'6–10',rest:30,loadType:'kg',increment:2.5,note:'Movimento piccolo e controllato. Nessuna trazione completa richiesta.'},
   {id:'rdl',section:'Forza · 25–28 min',name:'Romanian deadlift con manubri',sets:3,reps:'8–10',rest:90,loadType:'kg',increment:2,note:'Segna il peso di un singolo manubrio. Anca indietro, schiena neutra.'},
   {id:'goblet',section:'Forza · 25–28 min',name:'Goblet squat',sets:3,reps:'8–12',rest:90,loadType:'kg',increment:2,note:'Se preferisci, puoi sostituirlo con split squat.'},
   {id:'row',section:'Forza · 25–28 min',name:'Rematore chest-supported o manubrio',sets:3,reps:'8–12',rest:90,loadType:'kg',increment:2,note:'Evita slanci; chiudi il movimento con la schiena.'},
   {id:'latneutral-b',section:'Forza · 25–28 min',name:'Lat machine neutra o supina',sets:2,reps:'8–12',rest:75,loadType:'kg',increment:2.5,note:'Volume moderato per costruire la prima trazione.'},
   {id:'lateralraise-b',section:'Spalle · 5 min',name:'Alzate laterali',sets:2,reps:'12–15',rest:45,loadType:'kg',increment:1,note:'Deltoide laterale: priorità estetica per dare rotondità.'},
   {id:'pushup-progress-b',section:'Skill · 4–5 min',name:'Piegamenti · livello attuale',sets:2,reps:'6–10',rest:60,loadType:'variant',note:'Stessa progressione della seduta A.'},
   {id:'plank',section:'Core · 2 min',name:'Plank',sets:2,reps:'20–40 s',rest:30,loadType:'bodyweight',note:'Fermati prima di perdere la posizione.'}
  ]}
 },
 progression:{rule:'Doppia progressione: raggiungi il limite alto del range con tecnica pulita e circa 2 RIR, poi aumenta leggermente il carico. Per i piegamenti riduci gradualmente l’altezza del supporto.'}
};
const levels={
 pushup:[
  {n:1,name:'Wall push-up',target:'2×10–12 per 2 sedute'},
  {n:2,name:'Push-up inclinati alti',target:'2×10 per 2 sedute'},
  {n:3,name:'Push-up inclinati bassi',target:'2×10 per 2 sedute'},
  {n:4,name:'Push-up a terra singole/cluster',target:'5–6 reps totali pulite'},
  {n:5,name:'Push-up a terra',target:'2×8–10 puliti'}],
 pullup:[
  {n:1,name:'Lat machine + depressioni scapolari',target:'3×12 solide alla lat + 2×10 depressioni'},
  {n:2,name:'Trazioni assistite, assistenza alta',target:'2×6–8 controllate'},
  {n:3,name:'Trazioni assistite, meno assistenza',target:'2×6–8 controllate'},
  {n:4,name:'Negative controllate',target:'3×3 con discesa 4–5 s'},
  {n:5,name:'Prima trazione completa',target:'1–3 reps pulite'}],
 dip:[
  {n:1,name:'Non ancora inserite',target:'Costruisci prima 8–10 push-up puliti'},
  {n:2,name:'Support hold alle parallele',target:'3×15–20 s stabile'},
  {n:3,name:'Dips assistite corte',target:'2×6–8 senza fastidi'},
  {n:4,name:'Dips assistite complete',target:'2×8–10'},
  {n:5,name:'Dips libere',target:'3–5 reps pulite'}]
};
function baseState(){return{programs:[program],activeProgramId:program.id,workouts:[],body:[],tests:[],settings:{week:1,nextSession:'A',levels:{pushup:2,pullup:1,dip:1}}}}
function migrateState(src){let n=baseState();if(!src)return n;n.workouts=src.workouts||[];n.body=src.body||[];n.tests=src.tests||[];n.settings={...n.settings,...(src.settings||{}),levels:{...n.settings.levels,...(src.settings?.levels||{})}};let imported=(src.programs||[]).filter(x=>x&&x.id!==program.id&&!String(x.id||'').startsWith('fb-ab-restart-v'));n.programs=[program,...imported];n.activeProgramId=String(src.activeProgramId||'').startsWith('fb-ab-restart-v')?program.id:(src.activeProgramId||program.id);return n}
function load(){try{let v=localStorage.getItem(STORE);if(v)return migrateState(JSON.parse(v));for(const key of [OLD2,OLD]){let raw=localStorage.getItem(key);if(raw){let n=migrateState(JSON.parse(raw));localStorage.setItem(STORE,JSON.stringify(n));return n}}return baseState()}catch(e){return baseState()}}
let state=load();function save(){localStorage.setItem(STORE,JSON.stringify(state));renderAll()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function isoDate(){return new Date().toISOString().slice(0,10)}
function activeProgram(){return state.programs.find(p=>p.id===state.activeProgramId)||state.programs[0]}
function weekRule(p){let w=state.settings.week||1;return(p.weeks||[]).find(x=>w>=x.from&&w<=x.to)}
function prescribedSets(ex){let w=state.settings.week||1;if(w<=2&&['legpress','dbincline','latneutral','rdl','goblet','row'].includes(ex.id))return 2;return ex.sets}
function currentLevel(kind){let n=state.settings.levels?.[kind]||1;return levels[kind][Math.max(0,Math.min(levels[kind].length-1,n-1))]}
function nextSession(){return state.settings.nextSession||'A'}
function num(v){let n=parseFloat(String(v??'').replace(',','.'));return Number.isFinite(n)?n:null}
function repRange(txt){let m=String(txt||'').match(/(\d+)\s*[–-]\s*(\d+)/);if(m)return{min:+m[1],max:+m[2]};let one=String(txt||'').match(/\d+/);return one?{min:+one[0],max:+one[0]}:null}
function latestExerciseWorkout(ex){let ws=[...state.workouts].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));for(const w of ws){let ss=(w.sets||[]).filter(x=>x.exerciseId===ex.id&&x.done);if(ss.length)return{workout:w,sets:ss}}return null}
function fmtKg(x){return Number.isInteger(x)?String(x):String(Math.round(x*10)/10).replace('.',',')}
function loadRecommendation(ex){let prev=latestExerciseWorkout(ex);if(!prev)return ex.loadType==='kg'?{kind:'start',text:'Prima registrazione: scegli un carico facile, con circa 3 ripetizioni in riserva.'}:null;
 let rr=repRange(ex.reps),rpe=num(prev.workout.rpe),reps=prev.sets.map(x=>num(x.reps)).filter(x=>x!==null),loads=prev.sets.map(x=>num(x.load)).filter(x=>x!==null);
 if(ex.loadType==='kg'&&loads.length&&reps.length){let load=loads[0],same=loads.every(x=>Math.abs(x-load)<0.01),inc=ex.increment||2.5;if(!same)load=loads[loads.length-1];let minRep=Math.min(...reps),maxRep=Math.max(...reps),repText=reps.join('/');
  if(rr&&minRep>=rr.max&&(rpe===null||rpe<=8.5)){let next=Math.round((load+inc)*10)/10;return{kind:'up',value:next,text:`Ultima volta: ${fmtKg(load)} kg × ${repText}. Oggi prova ${fmtKg(next)} kg mantenendo almeno ${rr.min} reps per serie.`}}
  if(rr&&minRep<rr.min){let next=Math.max(0,Math.round((load-inc)*10)/10);return{kind:'down',value:next,text:`Ultima volta: ${fmtKg(load)} kg × ${repText}. Oggi valuta ${fmtKg(next)} kg per rientrare nel range ${rr.min}–${rr.max} con tecnica pulita.`}}
  let target=rr?Math.min(rr.max,minRep+1):null;return{kind:'hold',value:load,text:`Ultima volta: ${fmtKg(load)} kg × ${repText}. Mantieni ${fmtKg(load)} kg${target?` e prova ad aggiungere 1 rep dove riesci (obiettivo almeno ${target})`:''}.`}
 }
 if(ex.id.startsWith('pushup-progress')){let rr2=repRange(ex.reps);let minRep=reps.length?Math.min(...reps):0;if(rr2&&minRep>=rr2.max)return{kind:'skill',text:'Hai raggiunto il limite alto: ripeti una seconda seduta pulita, poi valuta di abbassare il supporto / salire di livello.'};return{kind:'skill',text:'Ripeti la stessa variante e prova ad aggiungere 1 ripetizione totale senza arrivare a cedimento.'}}
 return null}
function recommendationClass(r){return r?.kind==='up'?'badge':r?.kind==='down'?'gold':''}
function renderToday(){let p=activeProgram(),key=nextSession(),sess=p.sessions?.[key];if(!sess){document.querySelector('#today').innerHTML='<div class="empty">Programma non compatibile.</div>';return}let wr=weekRule(p),weekCount=state.workouts.filter(w=>w.programId===p.id&&w.week===(state.settings.week||1)).length,html=`<div class="card highlight"><div class="row"><div class="grow"><span class="pill badge">Prossima seduta: ${key}</span><div class="title" style="margin-top:8px">${esc(sess.name)}</div><div class="meta">Settimana <b>${state.settings.week||1}</b> · seduta ${Math.min(weekCount+1,3)}/3${wr?' · '+esc(wr.label)+' — '+esc(wr.modifier):''}</div></div><button class="secondary" onclick="toggleSession()">Passa a ${key==='A'?'B':'A'}</button><button class="secondary" onclick="changeWeek()">Cambia settimana</button></div><div class="note" style="margin-top:10px">${esc(p.progression?.rule||'')}</div></div>`;
 let lp=currentLevel('pushup'),lt=currentLevel('pullup');html+=`<div class="card warning"><div class="grid2"><div><div class="meta">Piegamenti</div><div class="title">Livello ${lp.n}/5 · ${esc(lp.name)}</div><div class="note">Obiettivo: ${esc(lp.target)}</div></div><div><div class="meta">Trazioni</div><div class="title">Livello ${lt.n}/5 · ${esc(lt.name)}</div><div class="note">Obiettivo: ${esc(lt.target)}</div></div></div></div>`;
 let sec='';sess.exercises.forEach(ex=>{if(ex.section!==sec){sec=ex.section;html+=`<div class="sectionhead">${esc(sec)}</div>`}let n=prescribedSets(ex),nm=ex.name;if(ex.id.startsWith('pushup-progress'))nm='Piegamenti · '+lp.name;let rec=loadRecommendation(ex);html+=`<div class="card exercise"><div class="title">${esc(nm)}</div><div class="meta">${n} serie × ${esc(ex.reps)} · recupero ${ex.rest}s</div><div class="note">${esc(ex.note||'')}</div>${rec?`<div class="goal" style="margin-top:9px"><span class="pill ${recommendationClass(rec)}">Suggerimento di oggi</span><div class="small" style="margin-top:5px">${esc(rec.text)}</div></div>`:''}`;for(let i=1;i<=n;i++){let suggested=(rec&&rec.value!==undefined&&ex.loadType==='kg')?` value="${rec.value}"`:'';html+=`<div class="setrow"><div class="muted small">S${i}</div><input placeholder="${ex.loadType==='variant'?'variante / altezza':ex.loadType==='bodyweight'?'BW':ex.loadType==='assist'?'assist. kg':'kg'}"${suggested} data-ex="${esc(ex.id)}" data-name="${esc(nm)}" data-set="${i}" data-field="load"><input inputmode="numeric" placeholder="reps" data-ex="${esc(ex.id)}" data-name="${esc(nm)}" data-set="${i}" data-field="reps"><input class="check" type="checkbox" data-ex="${esc(ex.id)}" data-name="${esc(nm)}" data-set="${i}" data-field="done"></div>`}html+='</div>'});
 html+=`<div class="card"><div class="grid2"><div><label>Durata effettiva (min)</label><input id="sessionDuration" inputmode="numeric" value="40"></div><div><label>RPE seduta (1–10)</label><input id="sessionRpe" inputmode="numeric" placeholder="es. 7"></div></div><label style="margin-top:10px">Note</label><textarea id="sessionNotes" rows="3" placeholder="Energia, fastidi, tecnica, RIR..."></textarea><button class="success" style="width:100%;margin-top:12px" onclick="saveWorkout()">Salva allenamento ${key}</button></div>`;document.querySelector('#today').innerHTML=html}
function saveWorkout(){let p=activeProgram(),key=nextSession(),sets=[];document.querySelectorAll('#today [data-ex]').forEach(el=>{let k=el.dataset.ex+'_'+el.dataset.set,obj=sets.find(x=>x.key===k);if(!obj){obj={key:k,exerciseId:el.dataset.ex,exerciseName:el.dataset.name,set:+el.dataset.set};sets.push(obj)}obj[el.dataset.field]=el.type==='checkbox'?el.checked:el.value});let week=state.settings.week||1;state.workouts.push({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(),date:isoDate(),timestamp:Date.now(),programId:p.id,programName:p.name,programVersion:p.version||1,week,session:key,duration:+document.querySelector('#sessionDuration').value||null,rpe:document.querySelector('#sessionRpe').value||'',notes:document.querySelector('#sessionNotes').value||'',sets});state.settings.nextSession=key==='A'?'B':'A';let completed=state.workouts.filter(w=>w.programId===p.id&&w.week===week).length;if(completed>=3){state.settings.week=week+1}localStorage.setItem(STORE,JSON.stringify(state));alert(`Allenamento salvato. Prossima seduta: ${state.settings.nextSession}.${completed>=3?` Inizia la settimana ${state.settings.week}.`:''}`);renderAll()}
function renderHistory(){let arr=[...state.workouts].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)),h='<div class="card"><div class="title">Storico allenamenti</div><div class="meta">Ogni seduta conserva programma, versione, settimana, A/B, carichi e ripetizioni.</div></div>';if(!arr.length)h+='<div class="empty">Nessun allenamento salvato.</div>';arr.forEach(w=>{let comp=(w.sets||[]).filter(s=>s.done).length;h+=`<div class="card"><div class="row"><div class="grow"><div class="title">${esc(w.date)} · ${esc(w.session||'?')} · ${esc(w.programName||'Programma')}</div><div class="meta">Settimana ${w.week||'—'} · ${comp} serie completate${w.duration?' · '+w.duration+' min':''}${w.rpe?' · RPE '+esc(w.rpe):''}</div>${w.notes?`<div class="note">${esc(w.notes)}</div>`:''}</div><button class="danger" onclick="deleteWorkout('${w.id}')">Elimina</button></div></div>`});document.querySelector('#history').innerHTML=h}
function deleteWorkout(id){if(confirm('Eliminare questo allenamento?')){state.workouts=state.workouts.filter(x=>x.id!==id);save()}}
function svgChart(points,label){if(points.length<2)return'<div class="empty">Servono almeno 2 rilevazioni.</div>';let vals=points.map(x=>x.v),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1,w=640,h=180,p=20;let pts=points.map((x,i)=>`${p+i*(w-2*p)/(points.length-1)},${h-p-(x.v-min)*(h-2*p)/range}`).join(' ');return`<svg class="miniChart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="3"/><text x="14" y="20" fill="currentColor" font-size="12">${esc(label)} · ${min.toFixed(1)} → ${max.toFixed(1)}</text></svg>`}
function bestByExercise(){let map={};state.workouts.forEach(w=>(w.sets||[]).forEach(s=>{let load=parseFloat(String(s.load||'').replace(',','.'));let reps=parseFloat(s.reps);if(!isNaN(load)&&!isNaN(reps)&&s.done){let e1=load*(1+reps/30),name=s.exerciseName||s.exerciseId;if(!map[name]||e1>map[name].e1)map[name]={e1,load,reps,date:w.date}}}));return map}
function renderProgress(){let lp=currentLevel('pushup'),lt=currentLevel('pullup'),ld=currentLevel('dip'),best=bestByExercise(),body=[...state.body].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>({v:+x.weight,date:x.date}));let h=`<div class="card"><div class="title">Progressioni skill</div><div class="meta">Il carico consigliato nella scheda Allenamento usa la tua ultima prestazione: aumenta dopo tutte le serie al limite alto del range, mantiene il carico quando sei nel range e propone un piccolo calo se scendi sotto il minimo. Modifica manualmente il livello skill quando raggiungi il criterio indicato. Le dips restano fuori dal programma finché non hai una buona base di piegamenti.</div><div class="grid3" style="margin-top:12px">${[['pushup','Piegamenti',lp],['pullup','Trazioni',lt],['dip','Dips',ld]].map(([k,t,l])=>`<div class="goal"><span class="pill gold">${t}</span><div class="level">${l.n}/5</div><strong>${esc(l.name)}</strong><div class="meta">${esc(l.target)}</div><div class="row" style="margin-top:10px"><button class="secondary" onclick="levelDown('${k}')">−</button><button class="primary" onclick="levelUp('${k}')">+</button></div></div>`).join('')}</div></div>`;h+=`<div class="card"><div class="title">Peso corporeo</div>${svgChart(body,'kg')}</div>`;let entries=Object.entries(best).sort((a,b)=>b[1].e1-a[1].e1).slice(0,8);h+=`<div class="card"><div class="title">Migliori prestazioni registrate</div><div class="meta">Stima comparativa basata su carico × ripetizioni; serve solo per vedere il trend, non è un vero massimale.</div>${entries.length?'<table><tr><th>Esercizio</th><th>Carico</th><th>Reps</th><th>Data</th></tr>'+entries.map(([n,v])=>`<tr><td>${esc(n)}</td><td>${v.load} kg</td><td>${v.reps}</td><td>${esc(v.date)}</td></tr>`).join('')+'</table>':'<div class="empty">Salva qualche allenamento per vedere i progressi.</div>'}</div>`;document.querySelector('#progress').innerHTML=h}
function levelUp(k){state.settings.levels[k]=Math.min(5,(state.settings.levels[k]||1)+1);save()}function levelDown(k){state.settings.levels[k]=Math.max(1,(state.settings.levels[k]||1)-1);save()}
function renderBody(){let rows=[...state.body].sort((a,b)=>b.date.localeCompare(a.date)),h=`<div class="card"><div class="title">Composizione corporea settimanale</div><div class="grid3" style="margin-top:12px"><div><label>Data</label><input id="bodyDate" type="date" value="${isoDate()}"></div><div><label>Peso (kg)</label><input id="bodyWeight" inputmode="decimal"></div><div><label>Massa magra (kg, opz.)</label><input id="bodyLean" inputmode="decimal"></div><div><label>Massa grassa (kg, opz.)</label><input id="bodyFat" inputmode="decimal"></div></div><button class="primary" style="margin-top:10px" onclick="addBody()">Aggiungi rilevazione</button></div>`;if(rows.length)h+='<div class="card"><table><tr><th>Data</th><th>Peso</th><th>Magra</th><th>Grassa</th></tr>'+rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${r.weight??'—'}</td><td>${r.lean??'—'}</td><td>${r.fat??'—'}</td></tr>`).join('')+'</table></div>';document.querySelector('#body').innerHTML=h}
function addBody(){let weight=parseFloat(document.querySelector('#bodyWeight').value);if(!weight){alert('Inserisci almeno il peso.');return}state.body.push({id:Date.now().toString(),date:document.querySelector('#bodyDate').value||isoDate(),weight,lean:parseFloat(document.querySelector('#bodyLean').value)||null,fat:parseFloat(document.querySelector('#bodyFat').value)||null});save()}
const testDefs=[['pushup','Piegamenti','Numero massimo di ripetizioni pulite. Nel rientro fermati prima che la tecnica crolli.'],['pushupHeight','Piegamenti inclinati','Annota altezza del supporto + reps: es. Smith 80 cm, 2×10.'],['lat','Lat machine','Miglior serie tecnica da 8–12 reps.'],['scap','Scapular pull','Ripetizioni controllate senza piegare i gomiti.'],['plank','Plank','Tempo tecnico massimo, senza cedimento lombare.']];
function renderTests(){let h='<div class="card"><div class="title">Test di progresso</div><div class="meta">Ripetili circa ogni 4–6 settimane. Non servono veri massimali in questa fase.</div></div>';testDefs.forEach(t=>{let latest=[...state.tests].filter(x=>x.type===t[0]).sort((a,b)=>b.date.localeCompare(a.date))[0];h+=`<div class="card"><div class="title">${t[1]}</div><div class="note">${t[2]}</div>${latest?`<div class="meta" style="margin-top:8px">Ultimo: <b>${esc(latest.value)}</b> · ${esc(latest.date)}</div>`:''}<div class="grid2" style="margin-top:10px"><input id="test_${t[0]}" placeholder="risultato / note"><button class="secondary" onclick="addTest('${t[0]}')">Salva test</button></div></div>`});document.querySelector('#tests').innerHTML=h}
function addTest(type){let el=document.querySelector('#test_'+type);if(!el.value.trim())return;state.tests.push({id:Date.now().toString(),type,date:isoDate(),value:el.value.trim()});save()}
function renderPrograms(){let h='<div class="card"><div class="title">Programmi</div><div class="meta">Puoi importare programmi diversi senza cancellare storico, peso o test. Per mantenere A/B, usa la struttura sessions.A e sessions.B.</div></div>';state.programs.forEach(p=>h+=`<div class="card"><div class="row"><div class="grow"><div class="title">${esc(p.name)} ${p.id===state.activeProgramId?'<span class="pill badge">Attivo</span>':''}</div><div class="meta">v${p.version||1}${p.sessions?' · split A/B':''}</div></div>${p.id!==state.activeProgramId?`<button class="primary" onclick="activateProgram('${p.id}')">Attiva</button>`:''}</div></div>`);h+=`<div class="card"><div class="title">Importa nuovo programma JSON</div><textarea id="programJson" rows="7" placeholder='{"id":"programma-2","name":"Nuovo programma","version":1,"sessions":{"A":{"exercises":[]},"B":{"exercises":[]}}}' style="margin-top:10px"></textarea><div class="row" style="margin-top:10px"><button class="primary" onclick="importProgramText()">Importa JSON</button><label class="btn secondary">Importa file<input type="file" accept="application/json" onchange="importProgramFile(this)" style="display:none"></label></div></div>`;document.querySelector('#programs').innerHTML=h}
function activateProgram(id){state.activeProgramId=id;state.settings.week=1;state.settings.nextSession='A';save()}
function normalizeProgram(p){if(!p.id)p.id='p-'+Date.now();if(!p.version)p.version=1;if(!p.sessions)throw new Error('Manca sessions');for(const k of ['A','B']){if(!p.sessions[k]||!Array.isArray(p.sessions[k].exercises))throw new Error('Manca sessions.'+k+'.exercises[]');p.sessions[k].exercises=p.sessions[k].exercises.map((e,i)=>({id:e.id||k+'-ex-'+i,section:e.section||'Allenamento',name:e.name||('Esercizio '+(i+1)),sets:+e.sets||1,reps:e.reps||'8–12',rest:+e.rest||60,loadType:e.loadType||'kg',increment:+e.increment||2.5,note:e.note||''}))}return p}
function importProgramText(){try{let p=normalizeProgram(JSON.parse(document.querySelector('#programJson').value));state.programs.push(p);state.activeProgramId=p.id;state.settings.week=1;state.settings.nextSession='A';save();alert('Programma importato e attivato.')}catch(e){alert('JSON non valido: '+e.message)}}
function importProgramFile(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{document.querySelector('#programJson').value=r.result;importProgramText()};r.readAsText(f)}
function renderBackup(){document.querySelector('#backup').innerHTML=`<div class="card"><div class="title">Backup completo</div><div class="meta">Esporta periodicamente i dati. Il backup contiene programmi, allenamenti, livelli skill, peso e test.</div><div class="row" style="margin-top:12px"><button class="primary" onclick="exportData()">Esporta backup JSON</button><label class="btn secondary">Ripristina backup<input type="file" accept="application/json" onchange="restoreData(this)" style="display:none"></label></div></div><div class="card"><div class="title">Dove vengono salvati i dati?</div><div class="meta">Nel localStorage del browser sul dispositivo. Questa app non richiede account e non invia i dati a un server. Se cancelli i dati di Safari/Chrome senza backup, puoi perdere lo storico.</div></div>`}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='full-body-ab-v3-backup-'+isoDate()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreData(input){let f=input.files[0];if(!f)return;if(!confirm('Questo sostituirà i dati presenti nell’app. Continuare?'))return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();alert('Backup ripristinato.')}catch(e){alert('Backup non valido.')}};r.readAsText(f)}
function changeWeek(){let w=parseInt(prompt('Settimana del programma:',state.settings.week||1));if(w>=1&&w<=99){state.settings.week=w;save()}}function toggleSession(){state.settings.nextSession=nextSession()==='A'?'B':'A';save()}
function renderAll(){renderToday();renderHistory();renderProgress();renderBody();renderTests();renderPrograms();renderBackup()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.tab).classList.add('active')});renderAll();if('serviceWorker'in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}
</script>
</body></html>
